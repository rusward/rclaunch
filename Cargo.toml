[workspace]
members = ["crates/core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["rclaunch contributors"]

[workspace.dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.dev]
# Меньше мусора в dev-сборке и быстрее линковка.
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
